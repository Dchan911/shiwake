<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簿記3級仕訳マスター：爆笑！実務ドリル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #fefce8;
            user-select: none;
        }
        .card {
            box-shadow: 0 8px 0 #fef08a;
            transition: all 0.2s ease;
        }
        .card:active {
            box-shadow: 0 2px 0 #fef08a;
            transform: translateY(4px);
        }
        .btn-account {
            transition: transform 0.1s;
        }
        .btn-account:active {
            transform: scale(0.95);
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-yellow-700">🎸 爆笑！簿記仕訳ドリル</h1>
        <div class="bg-white px-4 py-1 rounded-full border-2 border-yellow-400 font-bold text-yellow-700">
            Score: <span id="score">0</span>
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="w-full max-w-md bg-gray-200 rounded-full h-4 mb-6 overflow-hidden">
        <div id="progress" class="bg-yellow-400 h-full transition-all duration-500" style="width: 0%"></div>
    </div>

    <!-- Main Game Card -->
    <main id="game-container" class="w-full max-w-md bg-white rounded-3xl p-6 card border-2 border-yellow-200 mb-8">
        <!-- Content will be injected here -->
    </main>

    <!-- Account Selection Grid -->
    <div id="account-area" class="w-full max-w-md">
        <p class="text-center text-gray-500 text-sm mb-4 font-bold">使用する勘定科目（クリックで選択）👇</p>
        <div id="account-grid" class="grid grid-cols-3 gap-2 pb-10">
            <!-- Dynamic Buttons -->
        </div>
    </div>

    <!-- Result Overlay -->
    <div id="modal" class="overlay">
        <div class="bg-white p-8 rounded-3xl max-w-xs w-full text-center shadow-2xl mx-4 border-4 border-yellow-400">
            <div id="modal-icon" class="text-6xl mb-4">✨</div>
            <h2 id="modal-title" class="text-2xl font-bold mb-2">正解！</h2>
            <div id="modal-desc" class="text-gray-600 mb-6 text-sm whitespace-pre-wrap text-left"></div>
            <button id="next-btn" class="w-full py-3 bg-yellow-500 text-white rounded-xl font-bold shadow-md hover:bg-yellow-600">次へすすむ</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            { id: 1, question: "半年後のB’zのコンサートに会社の福利厚生費として参加するため、チケット代5,000円を現金で先払いした。", debit: "前払金", credit: "現金", column: "コラム：ライブが開催されるまでは「チケットをもらう権利」を持っている状態。だから資産なんです。" },
            { id: 2, question: "ビートルズの復活ライブイベントの前売り券を販売したところ、50,000円分が即完売し、現金で代金を受け取った。", debit: "現金", credit: "前受金", column: "コラム：お金はもらったけど、まだライブを見せていないので、これは「義務（負債）」として処理します。" },
            { id: 3, question: "映画「ゴジラ－１℃」の上映が無事に行われた。映画会社は、以前販売していた前売り券20,000円分を売上に振り替えた。", debit: "前受金", credit: "売上", column: "コラム：上映が完了して初めて、預かっていた「前受金」を「売上」に変えることができます。" },
            { id: 4, question: "富士山頂の自販機に並めるため、10,000円分のジュースを仕入れ、当座預金で支払った。なお、ヘリでの運搬費用に80,000円かかった。", debit: "仕入", credit: "当座預金", column: "コラム：仕入時の運賃は「付随費用」として仕入原価に含めます。つまりこのジュースの仕入原価は90,000円！" },
            { id: 5, question: "火星移住ツアーの予約金として、宇宙旅行会社に100,000円を当座預金から振り込んだ。出発は10年後の予定だ。", debit: "前払金", credit: "当座預金", column: "コラム：10年後でも、サービスを受けるまでは資産の「前払金」として帳簿に残ります。" },
            { id: 6, question: "戦国時代の武将から「城の修理代をツケにしてくれ」と頼まれ、100,000円の工事（売上）を完了させた。代金は掛けとした。", debit: "売掛金", credit: "売上", column: "コラム：戦国時代に売掛金があったら、回収（取り立て）に行くのも命がけですね。" },
            { id: 7, question: "江戸幕府から預かっていた「前受金」50,000円分の年貢（商品）を納め、無事に売上として計上した。", debit: "前受金", credit: "売上", column: "コラム：義務を果たした瞬間に、負債が収益に変わります。" },
            { id: 8, question: "「現金が足りない！」と叫ぶ社長のために、当座預金から1,000,000円を引き出して、レジの現金に補充した。", debit: "現金", credit: "当座預金", column: "コラム：銀行からお金を下ろすだけの仕訳ですが、大きな金額だとドキドキしますね。" },
            { id: 9, question: "仕入先から「返品されたら困るから、先に代金を払っておけ」と脅され（？）、10,000円を現金で先払いした。", debit: "前払金", credit: "現金", column: "コラム：内金や手付金はすべて「前払金」という名前のポケットに入ります。" },
            { id: 10, question: "石油王から「君の会社のサービスを1年分予約するよ」と言われ、1,000,000円が当座預金に振り込まれた。※まだサービスは提供していない。", debit: "当座預金", credit: "前受金", column: "コラム：大金が入っても、仕事をするまでは「前受金」です。使い込まないように注意！" },
            { id: 11, question: "以前予約していた黄金の椅子（仕入商品）が届いた！ 先に払っていた手付金2,000円を充当し、残りは掛けとした。※借方の仕訳は？", debit: "仕入", credit: "前払金", column: "コラム：商品が届いたので、前払金という権利を消費して「仕入」に変えます。" },
            { id: 12, question: "タイムマシンを開発するための研究費を銀行から500,000円借り、当座預金に振り込んでもらった。", debit: "当座預金", credit: "借入金", column: "コラム：借入金は、将来返さなければならない負債の代表格です。" },
            { id: 13, question: "借金大王から借りていた50,000円を、手元の現金でキッチリ返済した。利息は今回は考えないものとする。", debit: "借入金", credit: "現金", column: "コラム：返済すると負債（借入金）が減り、資産（現金）も減ります。" },
            { id: 14, question: "「ツケ」で買っていた高級ワインの代金30,000円を、銀行の当座預金からネットバンキングで支払った。", debit: "買掛金", credit: "当座預金", column: "コラム：買掛金を支払うと、貸方側の負債が消滅します。" },
            { id: 15, question: "売った商品が「辛すぎた」と返品された。以前の売掛金5,000円を帳消しにし、売上を取り消した。", debit: "売上", credit: "売掛金", column: "コラム：返品（逆仕訳）を行うことで、売った事実をなかったことにします。" },
            { id: 16, question: "仕入れた商品が「爆発した」ので即座に返品した。以前の買掛金8,000円をマイナス処理した。", debit: "買掛金", credit: "仕入", column: "コラム：仕入戻しは、借方に買掛金を持ってきて負債を減らします。" },
            { id: 17, question: "自分の店で売っている高級おにぎりを、取引先へのお土産用として1,000円分販売し、代金は現金で受け取った。", debit: "現金", credit: "売上", column: "コラム：おにぎり1個でも、ビジネスなら立派な売上です。その場で現金をもらえば「現金」が増えます。" },
            { id: 18, question: "「さっきの売上、1桁間違えてた！」とバイトから報告。10,000円の不足分を現金売上として追加計上した。", debit: "現金", credit: "売上", column: "コラム：ミスは即座に修正。それが経理の鉄則です。" },
            { id: 19, question: "仕入先への買掛金20,000円を、たまたまその仕入先に貸していたお金（売掛金）と相殺してチャラにした。", debit: "買掛金", credit: "売掛金", column: "コラム：お互いの貸し借りを相殺すると、振込手数料が節約できてハッピー！" },
            { id: 20, question: "泥棒に盗まれそうになったので、金庫の現金100,000円を急いで銀行の当座預金に預け入れた。", debit: "当座預金", credit: "現金", column: "コラム：金庫より銀行の方が安全。簿記上は「現金」から「当座預金」へのお引越しです。" },
            { id: 21, question: "謎の投資家から「応援してるよ」と現金10,000円を渡された。これは将来の商品の予約金（手付金）である。", debit: "現金", credit: "前受金", column: "コラム：応援の気持ちも、簿記では「前受金」というシビアな科目に。" },
            { id: 22, question: "以前販売した火星移住チケット（前受金）がキャンセルされた。預かっていた5,000円を現金で返金した。", debit: "前受金", credit: "現金", column: "コラム：前受金という「義務」を解消し、現金を返します。" },
            { id: 23, question: "将来販売するための在庫として「どこでもドア」を仕入れた。代金30,000円は当座預金から支払った。", debit: "仕入", credit: "当座預金", column: "コラム：どこでもドアが仕入商品なら、移動コストがゼロになる革命的なビジネスですね。" },
            { id: 24, question: "売掛金100,000円を回収しに行ったが、「現金がないから代わりにこれで」と借用書（借入金との相殺）を渡された。※借方の仕訳は？", debit: "借入金", credit: "売掛金", column: "コラム：相手の借金をチャラにする代わりに、自分の売掛金も消えます。" },
            { id: 25, question: "「この商品を今すぐ100個くれ！」と頼まれ、10,000円分の商品を現金で販売した。", debit: "現金", credit: "売上", column: "コラム：現金売上は商売の基本。チャリンとレジにお金が入る音は最高です。" },
            { id: 26, question: "借入金10,000円の返済期日が来たので、当座預金から自動引き落としで支払った。", debit: "借入金", credit: "当座預金", column: "コラム：引き落としを忘れると、ブラックリストに載ってしまうかも？" },
            { id: 27, question: "以前、現金で先払いしていた「特製ケーキ代（前払金）」5,000円が届いた。無事に仕入として処理した。※借方の仕訳は？", debit: "仕入", credit: "前払金", column: "コラム：ケーキが届いたので「ケーキをもらう権利」を使い果たしました。" },
            { id: 28, question: "売掛金20,000円が、取引先の石油王から当座預金に振り込まれた。回収成功！", debit: "当座預金", credit: "売掛金", column: "コラム：入金を確認する瞬間、経理担当者の肩の荷が下ります。" },
            { id: 29, question: "「お釣りがない！」とパニックになり、当座預金から現金5,000円を引き出してレジに入れた。", debit: "現金", credit: "当座預金", column: "コラム：お釣り用の小銭を確保するのも大事な財務の仕事です。" },
            { id: 30, question: "以前販売した伝説の剣（売上済）の代金として、売掛金50,000円を現金で回収した。", debit: "現金", credit: "売掛金", column: "コラム：伝説の剣の代金を現金で運んでくるのも大変そうですね。" }
        ];

        const accounts = ["現金", "当座預金", "借入金", "売掛金", "買掛金", "仕入", "売上", "前払金", "前受金"];

        // State
        let currentQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let wrongQuestionIds = [];
        let selection = { debit: null, credit: null };
        let selectedSide = 'debit';
        let isReviewMode = false;

        // UI Helpers
        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

        function initGrid() {
            const grid = document.getElementById('account-grid');
            grid.innerHTML = '';
            accounts.forEach(acc => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-yellow-100 py-4 rounded-xl text-sm font-bold text-gray-700 hover:border-yellow-400 btn-account card shadow-sm";
                btn.textContent = acc;
                btn.onclick = () => selectAccount(acc);
                grid.appendChild(btn);
            });
        }

        function startNewGame() {
            currentQuestions = shuffle(allQuestions).slice(0, 10);
            currentIdx = 0;
            score = 0;
            wrongQuestionIds = [];
            isReviewMode = false;
            document.getElementById('score').textContent = "0";
            restoreUI();
            loadQuestion();
        }

        function startReview() {
            currentQuestions = allQuestions.filter(q => wrongQuestionIds.includes(q.id));
            wrongQuestionIds = [];
            currentIdx = 0;
            isReviewMode = true;
            restoreUI();
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIdx];
            if (!q) return;

            document.getElementById('q-text').textContent = q.question;
            document.getElementById('q-column').textContent = q.column;
            document.getElementById('q-number').textContent = currentIdx + 1;
            document.getElementById('q-total').textContent = currentQuestions.length;
            
            selection = { debit: null, credit: null };
            updateSlots();
            selectedSide = 'debit';
            highlightActiveSlot();
            
            const progressPercent = (currentIdx / currentQuestions.length) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;

            const badge = document.getElementById('review-badge');
            if (isReviewMode) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        }

        function selectAccount(acc) {
            selection[selectedSide] = acc;
            updateSlots();
            if(selectedSide === 'debit' && !selection.credit) {
                selectedSide = 'credit';
            } else if (selectedSide === 'credit' && !selection.debit) {
                selectedSide = 'debit';
            }
            highlightActiveSlot();
        }

        function updateSlots() {
            const slotDebit = document.getElementById('slot-debit');
            const slotCredit = document.getElementById('slot-credit');
            
            slotDebit.textContent = selection.debit || "選択";
            slotCredit.textContent = selection.credit || "選択";
            
            slotDebit.className = `h-14 border-2 rounded-xl flex items-center justify-center font-bold transition-all ${selection.debit ? 'bg-blue-500 text-white border-blue-600' : 'border-dashed border-blue-200 text-blue-300 bg-blue-50'}`;
            slotCredit.className = `h-14 border-2 rounded-xl flex items-center justify-center font-bold transition-all ${selection.credit ? 'bg-red-500 text-white border-red-600' : 'border-dashed border-red-200 text-red-300 bg-red-50'}`;
        }

        function highlightActiveSlot() {
            const slotDebit = document.getElementById('slot-debit');
            const slotCredit = document.getElementById('slot-credit');
            slotDebit.classList.remove('ring-4', 'ring-yellow-400');
            slotCredit.classList.remove('ring-4', 'ring-yellow-400');
            if(selectedSide === 'debit') slotDebit.classList.add('ring-4', 'ring-yellow-400');
            else slotCredit.classList.add('ring-4', 'ring-yellow-400');
        }

        function handleAnswer() {
            if(!selection.debit || !selection.credit) return;

            const q = currentQuestions[currentIdx];
            const isCorrect = selection.debit === q.debit && selection.credit === q.credit;

            if(isCorrect) {
                if (!isReviewMode) score += 10;
                document.getElementById('score').textContent = score;
                showModal("正解！✨", "その通り！ナイス仕訳です。", "🎉");
            } else {
                if (!wrongQuestionIds.includes(q.id)) {
                    wrongQuestionIds.push(q.id);
                }
                showModal("仕訳ミス！", `正しい記録は...\n借方: 【${q.debit}】\n貸方: 【${q.credit}】\n\n次は間違えないようにしましょう！`, "🤔");
            }
        }

        function showModal(title, desc, icon) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal').style.display = 'flex';
        }

        document.getElementById('next-btn').onclick = () => {
            document.getElementById('modal').style.display = 'none';
            currentIdx++;
            if(currentIdx < currentQuestions.length) {
                loadQuestion();
            } else {
                showFinalResult();
            }
        };

        function showFinalResult() {
            document.getElementById('progress').style.width = `100%`;
            const container = document.getElementById('game-container');
            const hasWrong = wrongQuestionIds.length > 0;
            
            let html = `
                <div class="text-center py-4">
                    <div class="text-6xl mb-4">${hasWrong ? '🧐' : '👑'}</div>
                    <h2 class="text-2xl font-bold text-gray-700 mb-2">${isReviewMode ? '復習完了！' : 'ドリル終了！'}</h2>
                    <div class="text-4xl font-black text-yellow-600 mb-4">${score}点</div>
                    <p class="text-gray-500 mb-6 text-sm">間違えた問題: ${wrongQuestionIds.length} 件</p>
                    <div class="flex flex-col gap-3">
            `;

            if (hasWrong) {
                html += `<button onclick="startReview()" class="w-full py-3 bg-orange-500 text-white rounded-xl font-bold shadow-lg active:scale-95 transition-transform">間違えた問題だけ解き直す</button>`;
            }

            html += `
                        <button onclick="startNewGame()" class="w-full py-3 bg-yellow-500 text-white rounded-xl font-bold shadow-lg active:scale-95 transition-transform">新しい10問に挑戦する</button>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            document.getElementById('account-area').style.display = 'none';
        }

        function restoreUI() {
            const container = document.getElementById('game-container');
            container.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <div class="text-sm font-bold text-gray-400">第 <span id="q-number">1</span> / <span id="q-total"></span> 問</div>
                    <div id="review-badge" class="hidden bg-orange-100 text-orange-600 text-[10px] px-2 py-0.5 rounded-full font-bold border border-orange-200">復習モード</div>
                </div>
                <div id="q-text" class="text-lg font-bold text-gray-700 mb-4 min-h-[5rem] flex items-center">Loading...</div>
                <div id="q-column" class="bg-yellow-50 text-yellow-800 text-xs p-3 rounded-xl mb-6 border border-yellow-100 leading-relaxed shadow-inner"></div>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="space-y-2">
                        <div class="text-center text-xs font-bold text-blue-500">借方 (左)</div>
                        <div id="slot-debit" class="h-14 border-2 border-dashed border-blue-200 rounded-xl flex items-center justify-center text-blue-600 font-bold bg-blue-50 cursor-pointer">選択</div>
                    </div>
                    <div class="space-y-2">
                        <div class="text-center text-xs font-bold text-red-500">貸方 (右)</div>
                        <div id="slot-credit" class="h-14 border-2 border-dashed border-red-200 rounded-xl flex items-center justify-center text-red-600 font-bold bg-red-50 cursor-pointer">選択</div>
                    </div>
                </div>
                <button id="submit-btn" class="w-full py-4 bg-yellow-500 text-white rounded-2xl font-bold text-xl shadow-lg active:bg-yellow-600 transition-colors">回答する！</button>
            `;
            
            document.getElementById('slot-debit').onclick = () => { selectedSide = 'debit'; highlightActiveSlot(); };
            document.getElementById('slot-credit').onclick = () => { selectedSide = 'credit'; highlightActiveSlot(); };
            document.getElementById('submit-btn').onclick = handleAnswer;
            
            document.getElementById('account-area').style.display = 'block';
        }

        initGrid();
        startNewGame();
    </script>
</body>
</html>
